<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Skranji:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <main>
      <section class="img-section">
        <div class="section-title">
          <img src="./images/odin-lined.png" alt="" class="odin-logo" />
          <h1>ODIN</h1>
        </div>
        <div class="img-by">
          <p>
            Photo by
            <a href="https://unsplash.com/@haliewestphoto" target="_blank"
              >Hale West</a
            >
            on
            <a
              href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
              target="_blank"
              >Unsplash</a
            >
          </p>
        </div>
      </section>

      <section class="form-section">
        <div class="section-text">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up
            now to get started.
          </p>
          <p>You know you want to.</p>
        </div>

        <form action="">
          <h2 class="form-title">Let's do this!</h2>

          <div class="form-row">
            <div class="input-group">
              <label for="first-name">FIRST NAME</label>
              <input type="text" id="first-name" name="first-name" />
            </div>
            <div class="input-group">
              <label for="last-name">LAST NAME</label>
              <input type="text" id="last-name" name="last-name" />
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="email">EMAIL</label>
              <input type="email" id="email" name="email" />
            </div>

            <div class="input-group">
              <label for="phone-num">PHONE NUMBER</label>
              <input type="tel" id="phone-num" name="phone-num" />
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="password">PASSWORD</label>
              <input type="password" id="password" name="password" />
            </div>
            <div class="input-group">
              <label for="confirm-pass">CONFIRM PASSWORD</label>
              <input type="text" id="confirm-pass" name="confirm-pass" />
            </div>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
