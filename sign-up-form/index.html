<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Skranji:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <main>
      <section class="img-section">
        <div class="section-title">
          <img src="./images/odin-lined.png" alt="" class="odin-logo" />
          <h1>ODIN</h1>
        </div>
        <div class="img-by">
          <p>
            Photo by
            <a href="https://unsplash.com/@haliewestphoto" target="_blank"
              >Hale West</a
            >
            on
            <a
              href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
              target="_blank"
              >Unsplash</a
            >
          </p>
        </div>
      </section>

      <section class="form-section">
        <div class="section-text container">
          <p class="section-description">
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. <br />
            Sign up <i>now</i> to get started.
          </p>
          <p class="section-sub">You <i>know</i> you want to.</p>
        </div>

        <form action="">
          <div class="form-block">
            <h2 class="form-title">Let's do this!</h2>

            <div class="form-row">
              <div class="input-group">
                <label for="first-name">FIRST NAME</label>
                <input type="text" id="first-name" name="first-name" required />
              </div>
              <div class="input-group">
                <label for="last-name">LAST NAME</label>
                <input type="text" id="last-name" name="last-name" required />
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="email">EMAIL</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="example@gmail.com"
                  required
                />
              </div>

              <div class="input-group">
                <label for="phone-num">PHONE NUMBER</label>
                <input
                  type="tel"
                  id="phone-num"
                  name="phone-num"
                  placeholder="+2391819"
                  required
                />
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="password">PASSWORD</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  min="8"
                  required
                />
              </div>
              <div class="input-group">
                <label for="confirm-pass">CONFIRM PASSWORD</label>
                <input
                  type="password"
                  id="confirm-pass"
                  name="confirm-pass"
                  min="9"
                  required
                />
              </div>
            </div>
          </div>
          <div class="form-footer">
            <button type="submit" class="submit-btn">Create Account</button>
            <p class="login-text">
              Already have an account? <a href="#" class="login-link">Log in</a>
            </p>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
